name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "40 6 * * 1"   # weekly, to notice GitHub API changes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 is the oldest Python the action supports; ubuntu-latest (26.04) no longer has it.
          - { python: "3.9", os: ubuntu-24.04 }
          - { python: "3.12", os: ubuntu-latest }
          - { python: "3.x", os: ubuntu-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m py_compile sync.py
      - name: Unit tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: CLI help
        run: python sync.py --help > /dev/null

  dry-run:
    # Runs the action itself, read-only, against real public repos.
    name: Dry run of the action
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: sync
        uses: ./
        with:
          token: ${{ github.token }}   # read-only is enough for a dry run of public repos
          upstream-owner: storytold
          fork-owner: zuujiscom
          repos: |
            craft-fonts
            photocraft
          dry-run: "true"
      - name: Check outputs
        run: test "${{ steps.sync.outputs.failed }}" = "0" && test -n "${{ steps.sync.outputs.moved }}"
